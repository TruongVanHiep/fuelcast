services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: fuelcast-db
    environment:
      POSTGRES_DB: fuelcast
      POSTGRES_USER: fuelcast
      POSTGRES_PASSWORD: 123456
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5433:5432"
    volumes:
      - fuelcast-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuelcast -d fuelcast"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ứng dụng. `docker compose up -d` dựng cả hệ thống; khi chỉ cần DB để chạy ứng dụng
  # từ IDE thì dùng `docker compose up -d postgres` (tránh tranh cổng 8080 với IDE).
  app:
    build: .
    container_name: fuelcast-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Trong mạng của compose, DB là "postgres:5432" chứ không phải localhost:5433
      # (5433 chỉ là cổng ánh xạ ra máy chủ).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fuelcast
      # Chạy nền để tự nạp bản tin mới và chấm điểm dự báo. Mặc định trong
      # application.yaml là tắt, để test và các lệnh chạy một lần không gọi mạng.
      FUELCAST_INGESTION_POLL_ENABLED: "true"
      # Gọi dịch vụ dự báo Python bên dưới; mô hình của nó chạy song song với mô hình Java.
      # Không đặt depends_on forecast: nó hỏng thì chỉ mất dòng dự báo của nó.
      FUELCAST_FORECAST_PYTHON_ENABLED: "true"
      FUELCAST_FORECAST_PYTHON_URL: http://forecast:8000
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      # Trang chủ tĩnh: trả 200 khi Spring đã khởi động xong, không cần DB có dữ liệu.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  # Dịch vụ dự báo Python (fuelcast-forecast). Chỉ ứng dụng gọi nó, nên không mở cổng ra máy.
  forecast:
    build: ../fuelcast-forecast
    container_name: fuelcast-forecast
    restart: unless-stopped

  # ── Giám sát (tuỳ chọn, tốn thêm cỡ 300 đến 500 MB RAM) ─────────────────────────────────
  # Bật:  docker compose --profile observability up -d
  # Prometheus ở http://localhost:9090, Grafana ở http://localhost:3000 (tài khoản admin, mật khẩu
  # lấy từ biến GRAFANA_ADMIN_PASSWORD, mặc định "admin" chỉ cho máy phát triển). Cả hai chỉ nghe
  # ở 127.0.0.1: không mở ra mạng. Xem docs/observability.md.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.13.4
    container_name: fuelcast-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.4.13
    container_name: fuelcast-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fuelcast.json
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  fuelcast-pgdata:
  prometheus-data:
  grafana-data:
