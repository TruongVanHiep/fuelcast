spring:
  application:
    name: fuelcast-core

  datasource:
    url: jdbc:postgresql://localhost:5433/fuelcast
    username: fuelcast
    password: 123456

  jpa:
    hibernate:
      # Flyway giữ quyền tạo bảng. Hibernate chỉ được validate, không được tự sửa schema.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: Asia/Ho_Chi_Minh
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    # Mặc định Jackson ghi thời điểm theo UTC. Bản tin MOIT tính theo giờ Việt Nam
    # (kỳ nửa đêm 00:00 ngày 27 sẽ thành 17:00Z ngày 26 và bị đọc nhầm ngày).
    time-zone: Asia/Ho_Chi_Minh

  mvc:
    problemdetails:
      enabled: true   # lỗi chuẩn của Spring cũng trả application/problem+json (RFC 7807)

server:
  port: 8080

logging:
  level:
    vn.fuelcast: DEBUG

fuelcast:
  # Bật bằng: --fuelcast.import.csv=đường/dẫn/spike_result.csv
  import:
    csv: ""

  ingestion:
    poll:
      # Tự đi hỏi MOIT xem có bản tin mới. Mặc định TẮT để test và các lệnh chạy một
      # lần không lén gọi mạng. Bật khi triển khai: --fuelcast.ingestion.poll.enabled=true
      enabled: false

management:
  server:
    port: 8081          # cổng riêng, chỉ mạng nội bộ nói chuyện được
  endpoints:
    web:
      exposure:
        include: health,prometheus   # chỉ mở hai cái này, không mở env/beans/heapdump
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: fuelcast-core   # gắn nhãn cho mọi số đo, để sau này lọc theo ứng dụng
