server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API: chuyển sang ứng dụng Spring. "app" là tên service trong docker-compose; Docker
    # tự phân giải nó. Nhờ đó trình duyệt chỉ nói chuyện với một nơi, không cần CORS.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # Tên file trong /assets có mã băm nội dung (index-AbC123.js), đổi nội dung là đổi tên,
    # nên cache một năm mà không sợ người dùng thấy bản cũ.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Ứng dụng một trang: /scorecard, /history... không phải file thật. Mọi đường dẫn không
    # khớp file nào trả về index.html để React Router tự xử lý. index.html không được cache
    # lâu, nếu không người dùng giữ bản cũ trỏ tới file JS đã bị xoá sau lần triển khai mới.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.html;
    }
}
