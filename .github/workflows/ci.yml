name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Một lần chạy mới trên cùng nhánh thì huỷ lần cũ đang chạy dở.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # FuelcastCoreApplicationTests dựng cả Spring context nên cần một PostgreSQL
    # CÓ extension TimescaleDB (migration V1 chạy CREATE EXTENSION timescaledb).
    # Cổng 5433 và thông tin đăng nhập khớp application.yaml.
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: fuelcast
          POSTGRES_USER: fuelcast
          POSTGRES_PASSWORD: "123456"
          TZ: Asia/Ho_Chi_Minh
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fuelcast -d fuelcast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: fuelcast-core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # -B: không tô màu, không hỏi; -ntp: bỏ log tải thư viện cho dễ đọc.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: fuelcast-core/target/surefire-reports
