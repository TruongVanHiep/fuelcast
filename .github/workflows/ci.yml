name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Một lần chạy mới trên cùng nhánh thì huỷ lần cũ đang chạy dở.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # Ghim phiên bản hệ điều hành thay vì ubuntu-latest: nhãn "latest" sẽ tự chuyển
    # sang Ubuntu 26 vào 19/10/2026, và một bản hệ điều hành mới có thể làm gãy CI
    # đang xanh mà không ai động tay vào. Nâng phiên bản là một quyết định có chủ ý.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # FuelcastCoreApplicationTests dựng cả Spring context nên cần một PostgreSQL
    # CÓ extension TimescaleDB (migration V1 chạy CREATE EXTENSION timescaledb).
    # Cổng 5433 và thông tin đăng nhập khớp application.yaml.
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: fuelcast
          POSTGRES_USER: fuelcast
          POSTGRES_PASSWORD: "123456"
          TZ: Asia/Ho_Chi_Minh
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fuelcast -d fuelcast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: fuelcast-core

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # -B: không tô màu, không hỏi; -ntp: bỏ log tải thư viện cho dễ đọc.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: fuelcast-core/target/surefire-reports

  # Chỉ kiểm tra image còn dựng được, không đẩy đi đâu. Dockerfile không được test
  # bởi job trên nên rất dễ hỏng mà không ai biết cho tới lúc cần deploy.
  docker-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build the application image
        run: docker build -t fuelcast-core:ci fuelcast-core

      - name: Build the web image
        run: docker build -t fuelcast-web:ci fuelcast-web

  # Giao diện React: kiểm tra kiểu (tsc nằm trong "npm run build"), lint, và build.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fuelcast-web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: fuelcast-web/package-lock.json

      # "npm ci" cài đúng phiên bản trong package-lock.json và lỗi nếu lock lệch package.json.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build
