apiVersion: 1

# Grafana tự nối với Prometheus khi khởi động, không phải bấm tay trên giao diện. uid cố định để
# dashboard (dashboards/fuelcast.json) tham chiếu tới được.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
