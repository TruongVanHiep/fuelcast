apiVersion: 1

# Nạp mọi file .json trong thư mục này làm dashboard. Dashboard là mã nguồn nằm trong git, không phải
# thứ chỉ tồn tại trong ổ đĩa của Grafana: mất volume dữ liệu thì dựng lại được y nguyên.
providers:
  - name: fuelcast
    folder: FuelCast
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
